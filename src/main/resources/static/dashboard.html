<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Dashboard — Smart Task Manager</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-space bg-space-3">
<div class="app-shell">
    <header class="topbar">
        <div class="brand">Smart Task Manager</div>
        <div class="user-area">
            <div id="userInfo">User</div>
            <button id="logoutBtn" class="primary" style="padding:8px 12px;background:rgba(255,255,255,0.12);border-radius:8px">Logout</button>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <div class="header-row">
                <h3>Create Task</h3>
                <div class="small">Add new task (visible to users)</div>
            </div>

            <div id="createCard">
                <form id="taskForm">
                    <input id="title" placeholder="Title" required />
                    <textarea id="description" placeholder="Description"></textarea>
                    <div style="display:flex;gap:8px;align-items:center">
                        <input id="deadline" type="date" style="flex:1" required />
                        <select id="status" style="width:160px">
                            <option value="PENDING">PENDING</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                        <button class="primary" type="submit">Create Task</button>
                    </div>
                </form>
                <div id="taskMsg" style="margin-top:12px"></div>
            </div>
        </section>

        <section class="card">
            <div class="header-row">
                <h3>Your Tasks</h3>
                <div class="small">Manage tasks — admins see all tasks</div>
            </div>

            <ul id="taskList" class="task-list"></ul>
            <div id="emptyState" class="empty" style="display:none">No tasks yet</div>
        </section>
    </main>
</div>

<script src="/js/dashboard.js"></script>
<script src="/js/global.js"></script>

</body>
</html>
